[project]
name = "predictive-processing-demo"
version = "2.0.0"
description = "Closed-form Gaussian Bayesian Predictive Processing Multimodal Affect Perception & iCub Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "librosa>=0.10.0",
    "openai>=1.12.0",
    "faster-whisper>=1.0.0",
    "kokoro>=0.3.1",
    "pybullet>=3.2.6",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.5.0",
    "pyopenjtalk>=0.4.1",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "jaconv>=0.5.0",
    "mojimoji>=0.0.13",
    "misaki>=0.9.4",
    "open3d>=0.20.0",
    "roboticstoolbox-python>=1.4.4",
    "av>=14.0.0,<19.0.0",
    "nvidia-cublas-cu12>=12.1.0 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.0.0 ; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
